name: Publish Images

"on":
  workflow_call:

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}
  # All service images live in ONE Docker Hub repository. The service is
  # encoded in the tag instead of the repo name:
  #   <username>/online-boutique:<service>
  #   <username>/online-boutique:<service>-sha-<full-sha>
  IMAGE_REPO: online-boutique

jobs:
  docker-push:
    name: Docker Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
          - service: cartservice
          - service: checkoutservice
          - service: currencyservice
          - service: emailservice
          - service: frontend
          - service: loadgenerator
          - service: paymentservice
          - service: productcatalogservice
          - service: recommendationservice
          - service: shippingservice

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ matrix.service }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Tag and push to Docker Hub
        env:
          IMAGE_REF: ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_REPO }}:${{ matrix.service }}
          IMAGE_REF_SHA: ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_REPO }}:${{ matrix.service }}-sha-${{ github.sha }}
        run: |
          docker tag "$IMAGE_REF" "$IMAGE_REF_SHA"
          docker push "$IMAGE_REF"
          docker push "$IMAGE_REF_SHA"
