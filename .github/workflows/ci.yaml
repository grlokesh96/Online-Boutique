name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Reusable workflows can only ever narrow the GITHUB_TOKEN permissions granted
# by their caller -- they can never elevate them. This block is the ceiling
# passed down to security/build/docker/publish/notification. Without it the
# repo default (read-only) applies, which sets actions/security-events to
# "none" and makes the workflow fail *at startup* before any job is created:
#   The nested job 'codeql-analysis' is requesting 'actions: read,
#   security-events: write', but is only allowed 'actions: none,
#   security-events: none'.
# Keep this in sync with the per-job permissions blocks in the called workflows.
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  security:
    name: Security & Code Quality
    uses: ./.github/workflows/security.yaml
    secrets: inherit

  build:
    name: Build & Test
    needs: security
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  docker:
    name: Docker Build, SBOM & Trivy
    needs: build
    uses: ./.github/workflows/docker.yaml
    secrets: inherit

  publish:
    name: Publish Images
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish.yaml
    secrets: inherit

  notify:
    name: Notifications
    needs:
      - security
      - build
      - docker
      - publish
    if: always()
    uses: ./.github/workflows/notification.yaml
    with:
      gitleaks_result: ${{ needs.security.outputs.gitleaks }}
      semgrep_result: ${{ needs.security.outputs.semgrep }}
      codeql_result: ${{ needs.security.outputs.codeql }}
      eslint_result: ${{ needs.security.outputs.eslint }}
      hadolint_result: ${{ needs.security.outputs.hadolint }}
      build_result: ${{ needs.build.result }}
      docker_result: ${{ needs.docker.result }}
      publish_result: ${{ needs.publish.result }}
    secrets: inherit
